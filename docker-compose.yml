# Entorno local de desarrollo. Los defaults son publicos y SOLO para desarrollo:
# cualquier entorno compartido debe sobreescribirlos via .env o variables de entorno.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportbooking}
      POSTGRES_USER: ${POSTGRES_USER:-sportbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportbooking}
    volumes:
      - sportbooking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sportbooking-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sportbooking}
      DB_USERNAME: ${DB_USERNAME:-sportbooking}
      DB_PASSWORD: ${DB_PASSWORD:-sportbooking}
      JWT_SECRET: ${JWT_SECRET:-sportbooking-dev-only-jwt-secret-change-me-1234}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_DEV_ADMIN_EMAIL: ${APP_DEV_ADMIN_EMAIL:-admin@sportbooking.dev}
      APP_DEV_ADMIN_PASSWORD: ${APP_DEV_ADMIN_PASSWORD:-admin123}
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/v3/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  sportbooking_pgdata:
    name: sportbooking_pgdata
