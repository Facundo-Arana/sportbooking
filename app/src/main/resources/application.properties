spring.application.name=sportbooking
server.port=8081

#debug=true

# Config local (secretos): archivo NO versionado. Ver .gitignore.
spring.config.import=optional:file:./application-local.properties,optional:file:../application-local.properties

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# CORS (frontend SPA). Origen del dev server de Vite por defecto.
# allowed-methods debe incluir PATCH: /reservations/{id}/cancel|status|payment lo usan.
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Flyway: dueño unico del esquema (deuda #3). Al arrancar aplica las
# migraciones versionadas de classpath:db/migration antes de inicializar JPA.
# Spring Boot ordena Flyway -> Hibernate, asi que el siguiente validate ve el
# esquema ya migrado.
spring.flyway.enabled=true
# El historial de Flyway (flyway_schema_history) vive dentro de "platform", no
# en el schema por defecto de la conexion (public). Asi un DROP SCHEMA platform
# CASCADE resetea base Y versionado juntos, y el proximo arranque vuelve a
# aplicar todas las migraciones desde cero.
spring.flyway.schemas=platform

# JPA / Hibernate: la app NO muta el esquema (antes update). Solo valida que el
# esquema migrado por Flyway coincida con el modelo de entities y falla al
# arrancar si no coincide (no lo ajusta en silencio).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


jwt.secret=${JWT_SECRET:}

# Credenciales del admin sembrado por DevDataSeeder. SOLO desarrollo (perfil dev):
# en Docker se pasan por APP_DEV_ADMIN_EMAIL / APP_DEV_ADMIN_PASSWORD (ver docker-compose.yml).
app.dev.admin.email=${APP_DEV_ADMIN_EMAIL:admin@sportbooking.dev}
app.dev.admin.password=${APP_DEV_ADMIN_PASSWORD:admin123}