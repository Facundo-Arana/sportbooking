# Perfil "test": base H2 en memoria en modo PostgreSQL, sin depender de la
# instancia local. El schema "platform" lo declaran las entities
# (@Table(schema="platform")) y H2 no lo crea solo, asi que se crea con INIT al
# abrir la conexion. ddl-auto=create-drop crea/descarta las tablas por corrida.
# NON_KEYWORDS=USER: "user" es palabra reservada en H2 y la tabla platform.user
# de la entity User no se podria crear; se desactiva solo esa keyword.
spring.datasource.url=jdbc:h2:mem:sportbooking;MODE=PostgreSQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS platform
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Secreto ficticio SOLO para tests: HS256 exige >= 32 bytes. No es un secreto real.
jwt.secret=test-secret-jwt-hs256-000000000000000000000000
