# Perfil "test": lo usan los tests de integracion (app/src/test) via
# @ActiveProfiles("test"). El DataSource NO se configura aca: lo provee el
# PostgreSQLContainer con @ServiceConnection, que tiene precedencia sobre
# cualquier spring.datasource.* de application.properties. Por eso el
# Postgres nativo de dev no se toca.

# Esquema de test por create-drop de Hibernate (D2 del design): las entities
# son todas IDENTITY y el esquema real lo genero Hibernate, asi que se
# reconstruye equivalente sin heredar las secuencias duplicadas del dump.
# default_schema + create_namespaces: recrea el schema "platform" en el
# container limpio (si no, Hibernate no puede crear las tablas en un schema
# que no existe).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=platform
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# El schema lo maneja Hibernate: que Spring no intente autoconfigurar el
# DataSource solo con las propiedades (lo hace @ServiceConnection).
spring.jpa.defer-datasource-initialization=false

# Menos ruido en la consola de los tests.
spring.jpa.show-sql=false

# jwt.secret de test (el de application.properties es ${JWT_SECRET:}, vacio).
# Debe tener >= 32 caracteres para que Keys.hmacShaKeyFor acepte HS256.
jwt.secret=test-secret-key-for-integration-tests-0123456789

# CORS de test: mismo default que dev, explicito para que el test de
# preflight no dependa de defaults implicito.
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
